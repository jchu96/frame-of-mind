version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 5.9 is intentionally pinned until vue-tsc supports the
      # newer compiler API. Node type majors follow the supported runtime.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      development-dependencies:
        dependency-type: development

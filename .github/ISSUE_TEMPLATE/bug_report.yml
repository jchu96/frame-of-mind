name: Bug report
description: Report a problem with Frame of Mind
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Summarize the triggering condition, what Frame of Mind does, and why it matters.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact observed
      description: Quantify the affected runs, users, time, cost, or output when evidence permits.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest steps that reliably trigger the issue, using synthetic or redacted inputs.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual behavior
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Which part of Frame of Mind does this affect?
      options:
        - CLI
        - Web
        - Workflows
        - Hosted / Studio
        - CI gate
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and suspected root cause
      description: Separate observed evidence from any root-cause inference; include verified file or line pointers when useful.
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Describe any safe workaround currently in use.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The Frame of Mind version, tag, or commit SHA you are running.
      placeholder: e.g. v0.4.0 or commit abc1234
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        Paste only the output needed to establish the failure. Redact API keys,
        OAuth tokens, signed URLs, transcripts, recordings, participant data,
        and generated analyses because issue content is public.
      render: shell
    validations:
      required: false

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/ci-green
    tags:
      - "v*"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      # 2026-11-24: apt consumed 14m37s of the 15-minute gate. Replaces the apt-line test.
      # Review by: 2026-12-23 (protects: tooling)
      - &ffmpeg-key
        name: Identify pinned ffmpeg cache
        id: ffmpeg-key
        run: python3 scripts/install-ci-ffmpeg.py key >> "$GITHUB_OUTPUT"

      - &ffmpeg-cache
        name: Cache pinned Ubuntu media packages
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ci-ffmpeg-debs
          key: ${{ steps.ffmpeg-key.outputs.key }}

      - &ffmpeg-install
        name: Install verified ffmpeg and ffprobe
        timeout-minutes: 3
        env:
          FFMPEG_CACHE_HIT: ${{ steps.ffmpeg-cache.outputs.cache-hit }}
        run: python3 scripts/install-ci-ffmpeg.py

      - name: Run pull-request gate
        env:
          FRAME_OF_MIND_GATE_HOSTED_LANE_SEPARATE: "1"
        run: bun run check:pr --base "origin/${{ github.base_ref || 'main' }}"

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          package-manager-cache: false

      # 2026-11-23: the first standalone build silently lost the Sentry loader.
      # Existing checks cover installed files. Review by: 2027-02-20 (protects: user)
      - name: Build and smoke-test the standalone CLI
        run: |
          node scripts/build-release.mjs
          node scripts/smoke-release.mjs

      - name: Reject high or critical production advisories
        # No patched release; no user-supplied glob patterns or vulnerable matcher
        # code in the CLI, local Studio server, or hosted Worker builds. Owner: hub.
        # Remove when the advisory names a patched version; re-decide by 2026-12-18.
        run: |
          today="$(date -u +%F)"
          if [[ "$today" > "2026-12-18" ]]; then
            echo "AUDIT_EXCEPTION_EXPIRED GHSA-fc5q-39xc-vjpf review-by=2026-12-18"
            exit 1
          fi
          bun audit --production --audit-level=high --ignore=GHSA-fc5q-39xc-vjpf

  auth-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run required Better Auth and D1 contract
        run: bun run check:auth-contract

      - name: Upload Better Auth contract failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-contract-playwright-report
          path: |
            playwright-report/
            test-results/playwright/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  serial-check:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      FRAME_OF_MIND_STEP_TIMEOUT_SECONDS: '1800'
      FRAME_OF_MIND_GATE_PARALLELISM: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - *ffmpeg-key
      - *ffmpeg-cache
      - *ffmpeg-install

      - name: Run default gate
        run: bun run check:pr

      - name: Run whole hosted lane
        if: ${{ !cancelled() }}
        run: bun run check:lane:hosted

  fresh-clone:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mode: fresh
          - os: macos-latest
            mode: fresh
          - os: windows-latest
            mode: install-only
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Preserve LF checkout on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Test installation from a fresh clone
        run: bun --no-env-file scripts/test-fresh-clone.ts ${{ matrix.mode }}

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run synthetic Studio browser tests
        run: bun run test:e2e:ci

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/playwright/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Build the tagged version and verify the release files
        run: |
          node scripts/build-release.mjs "$GITHUB_REF_NAME"
          (cd release && sha256sum --check SHA256SUMS)
          node scripts/smoke-release.mjs
      - name: Publish the verified files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse HEAD)
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)" = "$commit"
          flags=()
          version=${GITHUB_REF_NAME%%+*}
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" release/{frameofmind.mjs,LICENSE,THIRD-PARTY-NOTICES.txt,release.json,SHA256SUMS} release/*.schema.json \
            "${flags[@]}" --verify-tag --title "Frame of Mind $GITHUB_REF_NAME" --generate-notes \
            --notes "Built from commit $commit. In the single file, the error-reporting SDK’s automatic instrumentation of third-party modules is off."

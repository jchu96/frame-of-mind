name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      lanes: ${{ steps.tier.outputs.lanes }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Select required gate tier
        id: tier
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            tier=$(bun scripts/run-check-sharded.ts --tier pr --base "origin/$BASE_REF" --print-tier)
          else
            tier=sharded
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          if [ "$tier" = "sharded" ]; then
            echo 'lanes=["fast","local","hosted"]' >> "$GITHUB_OUTPUT"
          else
            echo 'lanes=["fast","local"]' >> "$GITHUB_OUTPUT"
          fi

  gate-lanes:
    needs: gate-policy
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.gate-policy.outputs.lanes) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.lane }} gate lane
        run: bun run check:lane:${{ matrix.lane }}

      - name: Reject high or critical production advisories
        if: matrix.lane == 'fast'
        run: bun audit --production --audit-level=high

  serial-check:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run serial fallback gate
        run: bun run check

  fresh-clone:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mode: fresh
          - os: macos-latest
            mode: fresh
          - os: windows-latest
            mode: install-only
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Preserve LF checkout on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Test installation from a fresh clone
        run: bun --no-env-file scripts/test-fresh-clone.ts ${{ matrix.mode }}

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run synthetic Studio browser tests
        run: bun run test:e2e:ci

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/playwright/artifacts/
          if-no-files-found: ignore
          retention-days: 7

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/ci-green
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run pull-request gate
        env:
          FRAME_OF_MIND_GATE_HOSTED_LANE_SEPARATE: "1"
        run: bun run check:pr --base "origin/${{ github.base_ref || 'main' }}"

      - name: Reject high or critical production advisories
        run: bun audit --production --audit-level=high

  hosted-contracts:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Non-blocking while https://github.com/jchu96/frame-of-mind/issues/96 tracks 2-core timing.
    continue-on-error: true
    env:
      FRAME_OF_MIND_STEP_TIMEOUT_SECONDS: '1800'
      FRAME_OF_MIND_GATE_PARALLELISM: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run hosted contract lane
        run: bun run check:lane:hosted

  serial-check:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run serial fallback gate
        run: bun run check

  fresh-clone:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mode: fresh
          - os: macos-latest
            mode: fresh
          - os: windows-latest
            mode: install-only
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Preserve LF checkout on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Test installation from a fresh clone
        run: bun --no-env-file scripts/test-fresh-clone.ts ${{ matrix.mode }}

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run synthetic Studio browser tests
        run: bun run test:e2e:ci

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/playwright/artifacts/
          if-no-files-found: ignore
          retention-days: 7
